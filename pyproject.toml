[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmedic"
version = "0.1.0"
description = "Verified, least-privilege troubleshooting of AWS network and IAM misconfigurations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mithin Sagar" }]
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
llm = ["mlx-lm>=0.20"]
aws = ["boto3>=1.34"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
cloudmedic = "cloudmedic.cli:main"

[tool.setuptools.packages.find]
include = ["cloudmedic*"]
